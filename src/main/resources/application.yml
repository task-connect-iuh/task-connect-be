spring:
  application:
    name: task-connect

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taskconnect}
    username: ${DB_USER:taskconnect}
    # Bat buoc set qua bien moi truong (.env o dev, secret manager o production).
    # Khong dat default de app fail-fast khi thieu, tranh chay bang mat khau dev.
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: taskconnect-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Rule 12 cam update va create-drop o moi moi truong. Schema do Flyway quan ly.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-migration-naming: true
    placeholders:
      # Nap vao V10__seed_admin_account.sql - KHONG dat default, thieu bien thi app khong
      # khoi dong duoc (giong JWT_SECRET/DB_PASSWORD), tranh seed nham email/hash rong.
      adminEmail: ${ADMIN_SEED_EMAIL}
      adminPasswordHash: ${ADMIN_SEED_PASSWORD_HASH}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    # Khong dat default: admin/admin lot len production la tham hoa.
    password: ${RABBITMQ_PASSWORD}

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    # Khac voi DB_PASSWORD/JWT_SECRET o tren, hai bien nay CO default rong. Ly do: app
    # phai khoi dong duoc o may dev khi chua co API key Brevo (app.mail.enabled=false).
    # Fail-fast van con, nhung chuyen xuong SmtpEmailSender.@PostConstruct - bean do chi
    # ton tai khi app.mail.enabled=true va nem IllegalStateException ngay luc khoi tao
    # neu thieu username/password. Dat ${MAIL_PASSWORD} khong default o day se sap
    # context o moi may dev chua co key, vi Spring resolve placeholder luc bind bat ke
    # bean mail co duoc tao hay khong.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Bat buoc. Thieu timeout thi mot ket noi treo toi Brevo giu luon mot luong
          # trong notificationExecutor vo thoi han va lam nghen ca hang doi mail.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    # Phai la dia chi da xac minh trong Brevo (Senders & IP), neu khong relay tra 550.
    from-address: ${MAIL_FROM_ADDRESS:no-reply@taskconnect.vn}
    from-name: ${MAIL_FROM_NAME:TaskConnect}

  jwt:
    # Bat buoc set qua bien moi truong, toi thieu 32 ky tu (xem .env.example).
    # KHONG dat gia tri default o day: neu production quen set bien, app phai sap
    # ngay luc khoi dong thay vi im lang ky token bang secret nam cong khai trong repo.
    # Sinh secret moi: openssl rand -base64 48
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:15}
    # Secure=true bat buoc khi len production (cookie chi gui qua HTTPS). Mac dinh false
    # de dev chay duoc tren http://localhost khong co HTTPS.
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}

  cors:
    # Domain FE duoc phep goi API kem cookie (Access-Control-Allow-Credentials=true doi
    # hoi origin cu the, khong duoc dung "*"). Doi sang domain that khi len production.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

  admin:
    # Email tai khoan super-admin duy nhat - AuthService so khop email nay o tang service de
    # nhan dien super-admin (khong dung role rieng trong schema), xem
    # docs/PROGRESS-ADMIN-MODULE.md "Cac quyet dinh da chot". Cung bien dung de seed
    # V10__seed_admin_account.sql qua flyway.placeholders o tren - phai khop nhau.
    super-admin-email: ${ADMIN_SEED_EMAIL}

  google:
    # Client ID cua OAuth 2.0 Client (loai Web application) tao trong Google Cloud Console.
    # BAT BUOC set qua bien moi truong, khong dat default - GoogleIdTokenVerifier dung gia
    # tri nay lam audience, thieu se cho phep token cua bat ky client Google nao khac.
    client-id: ${GOOGLE_CLIENT_ID}
  firebase:
    # Xac minh so dien thoai (Firebase Phone Auth, test-number whitelist luc demo). BAT BUOC
    # set qua bien moi truong, khong dat default - FirebaseTokenVerifierService dung 2 gia
    # tri nay de khoi tao Admin SDK va kiem tra token dung phat cho dung Firebase project.
    project-id: ${FIREBASE_PROJECT_ID}
    service-account-json-base64: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64}

  crypto:
    # Bat buoc set qua bien moi truong. Khac JWT_SECRET (chi ky, xoay vong duoc), khoa nay
    # ma hoa du lieu luu lau dai (CCCD, chung chi) - doi khoa se khong giai ma duoc du lieu
    # cu, nen KHONG duoc de trong o bat ky moi truong nao. Sinh khoa moi: openssl rand -base64 32
    key: ${APP_CRYPTO_KEY}

ai:
  embedding:
    provider: gemini
    # Bat buoc set qua bien moi truong, khong dat default (giong JWT_SECRET/DB_PASSWORD) -
    # khoa nay goi API tra phi/co quota that ra ngoai, khong duoc chay bang gia tri rong
    # hoac hardcode trong repo.
    api-key: ${GEMINI_API_KEY}
    model: gemini-embedding-001
    daily-quota: ${AI_EMBEDDING_DAILY_QUOTA:1000}
  llm:
    provider: groq
    # Cung ly do voi ai.embedding.api-key o tren - khong dat default.
    api-key: ${GROQ_API_KEY}
    # llama-3.3-70b-versatile RIENG bi Groq go khoi API that (404 model_not_found xac nhan
    # 2026-09-14), va doi llama-3.1-8b-instant cung khong con nua - goi GET
    # api.groq.com/openai/v1/models bang key that cho thay TOAN BO dong Llama thô da bi go
    # khoi catalog tai khoan nay, chi con GPT-OSS (OpenAI open-weight) va Qwen. Doi sang
    # openai/gpt-oss-120b (131K context, ho tro json_mode + structured_outputs + reasoning,
    # chat luong cao nhat trong danh sach con hoat dong). Doi qua bien moi truong GROQ_MODEL
    # neu Groq lai doi/go model lan nua, khong can sua code - kiem tra danh sach that bang
    # chinh lenh GET models o tren, KHONG dua vao docs cong khai (co the chua cap nhat kip).
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    # Free tier gpt-oss-120b: 1.000 request/ngay NHUNG chi 200.000 token/ngay - gioi han that
    # su bop nghet la TPD chu khong phai RPD. Moi lan goi ~1.500-2.500 token (10 ho so Tasker +
    # mo ta Task), nen tran token that cho phep ~80-130 lan goi/ngay, khong phai 900.
    # QuotaTrackerService dem theo SO REQUEST (khong dem token), nen ha nguong xuong 80 de
    # chan truoc khi cham TPD that, chua margin an toan. Tang lai neu do luong thay prompt
    # thuc te ngan hon uoc tinh.
    daily-quota: ${AI_LLM_DAILY_QUOTA:80}

vietmap:
  # maps.vietmap.vn - reverse geocode/autocomplete/place/dinh tuyen. Goi TU BACKEND (khong
  # phai frontend) de khong lo api-key qua network tab/bundle JS - khac tilemap-key (VITE_
  # VIETMAP_TILEMAP_KEY ben task-connect-fe/.env), key do dung de MapLibre/vietmap-gl-js tai
  # tile/style truc tiep tu trinh duyet nen buoc phai cong khai, khong proxy duoc qua backend.
  # Bat buoc set qua bien moi truong, khong dat default - giong GEMINI_API_KEY/GROQ_API_KEY.
  api-key: ${VIETMAP_API_KEY}
  base-url: ${VIETMAP_BASE_URL:https://maps.vietmap.vn}

matching:
  weights:
    # Trong so xep hang cau truc (structuredScore), tong = 1.0 - xem
    # task-connect-claude/docs plan "Tasker goi y" da duyet. Cau hinh duoc de de chinh sau
    # khi co du lieu that, khong hardcode trong Java.
    distance: 0.35
    price: 0.25
    experience: 0.15
    availability: 0.25
    # Trong so tron semanticScore vao finalScore: finalScore = (1 - semantic) * structuredScore
    # + semantic * semanticScore.
    semantic: 0.30
  low-confidence-threshold: ${MATCHING_LOW_CONFIDENCE_THRESHOLD:50}

aws:
  s3:
    # Bat buoc set qua bien moi truong, khong dat default: sai bucket/khoa se upload
    # nham hoac loi 403 ngay khi goi, ro rang hon la im lang chay voi gia tri rong.
    # Xem docs/adr/ADR-003-avatar-storage-s3-presigned-upload.md.
    region: ${AWS_S3_REGION:ap-southeast-1}
    bucket: ${AWS_S3_BUCKET}
    access-key-id: ${AWS_S3_ACCESS_KEY_ID}
    secret-access-key: ${AWS_S3_SECRET_ACCESS_KEY}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      # Mac dinh Actuator mo mot ket noi SMTP that moi lan goi /actuator/health, ma
      # endpoint do dang public trong SecurityConfig. Se lam health check cham va bao
      # DOWN o may dev chua co key Brevo.
      enabled: false

logging:
  level:
    vn.taskconnect: DEBUG
    org.hibernate.SQL: INFO